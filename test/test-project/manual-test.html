<!-- ═══════════════════════════════════════════════════════════════════
     MANUAL TEST: HTML — Design System Language Server
     ═══════════════════════════════════════════════════════════════════
     Open this file in Zed and test each numbered scenario.
     Expected behavior is documented in comments.
-->
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>DS Language Server — Manual Test</title>
  <style>
    /* ─── TEST 1: Token completions in <style> ───────────────────────
       Place cursor after "var(--acme-" and trigger autocomplete.
       EXPECT: 6 token suggestions; the deprecated token uses native editor styling
    */
    .hero {
      border-radius: var(--acme-);
      /* ↑ cursor here */
    }

    /* ─── TEST 2: Deprecated token diagnostic ────────────────────────
       EXPECT: editor-native warning/error diagnostic on the token name below
       EXPECT: hover shows deprecation message + removal date
    */
    .deprecated-token {
      background: var(--acme-color-background-button-primary-pressed);
    }

    /* ─── TEST 3: Valid token — no diagnostic ────────────────────────
       EXPECT: no warning, clean
    */
    .valid-token {
      border-radius: var(--acme-border-radius-md);
    }
  </style>
</head>
<body>

  <!-- ─── TEST 4: Component tag completions ──────────────────────────
       Place cursor after "<acme-" and trigger autocomplete.
       EXPECT: acme-button, acme-shortcut suggested
  -->
  <acme-></acme->
  <!-- ↑ cursor between "acme-" and ">" -->


  <!-- ─── TEST 5: Attribute name completions ─────────────────────────
       Place cursor after "acme-button " (space after tag) and trigger.
       EXPECT: variant, size, type, href, disabled, deprecated label, slot, etc.
  -->
  <acme-button ></acme-button>
  <!-- ↑ cursor before ">" -->


  <!-- ─── TEST 6: Attribute VALUE completions ────────────────────────
       Place cursor between the quotes and trigger.
       EXPECT: primary, secondary, deprecated tertiary
  -->
  <acme-button variant=""></acme-button>
  <!-- ↑ cursor inside quotes -->


  <!-- ─── TEST 7: Deprecated attribute value diagnostic ──────────────
       EXPECT: editor-native warning/error on variant="tertiary"
       EXPECT: message mentions "Use `secondary` instead"
       EXPECT: code action offers replacement
  -->
  <acme-button variant="tertiary">Don't use this</acme-button>


  <!-- ─── TEST 8: Deprecated ATTRIBUTE diagnostic ────────────────────
       EXPECT: editor-native warning/error on the "label" attribute
       EXPECT: message says "Use `default` slot instead"
  -->
  <acme-button label="Old API">Deprecated attr</acme-button>


  <!-- ─── TEST 9: Valid usage — no diagnostics ───────────────────────
       EXPECT: clean, no warnings
  -->
  <acme-button variant="primary" size="small">
    All good here
  </acme-button>


  <!-- ─── TEST 10: Slot completions ──────────────────────────────────
       Place cursor inside slot="" and trigger.
       EXPECT: "start" and "end" suggested (not "default")
  -->
  <acme-button variant="primary">
    <svg slot="">←</svg>
    <!-- ↑ cursor inside slot="" -->
    Click me
  </acme-button>


  <!-- ─── TEST 11: Slot attribute suggestion ─────────────────────────
       Place cursor after "<span " inside acme-button and trigger.
       EXPECT: "slot" attribute offered with detail "start | end"
  -->
  <acme-button variant="secondary">
    <span ></span>
    <!-- ↑ cursor after "span " -->
  </acme-button>


  <!-- ─── TEST 12: Draft component diagnostic ────────────────────────
       EXPECT: editor-native information diagnostic on <acme-shortcut>
       EXPECT: message mentions "draft" status
  -->
  <acme-shortcut label="Settings" layout="horizontal"></acme-shortcut>


  <!-- ─── TEST 13: Utility class completions ─────────────────────────
       Place cursor after "acme-" and trigger.
       EXPECT: 44 utility classes (acme-text-*, acme-font-*)
  -->
  <div class="acme-"></div>
  <!-- ↑ cursor after "acme-" -->


  <!-- ─── TEST 14: Multiple classes — completion mid-value ───────────
       Place cursor after the space (before acme-font-) and trigger.
       EXPECT: utility class suggestions
  -->
  <p class="acme-text-body-default acme-"></p>
  <!-- ↑ cursor after last "acme-" -->


  <!-- ─── TEST 15: Hover on valid token ──────────────────────────────
       Hover over "--acme-border-radius-lg" below.
       EXPECT: markdown popup with value (16px), group, category, type
  -->
  <div style="border-radius: var(--acme-border-radius-lg)"></div>


  <!-- ─── TEST 16: Hover on component tag ────────────────────────────
       Hover over "acme-button" in the opening tag.
       EXPECT: component description, attribute list, slot info
  -->
  <acme-button variant="primary">Hover me</acme-button>


  <!-- ─── TEST 17: Hover on attribute ────────────────────────────────
       Hover over "size" attribute name.
       EXPECT: type info, allowed values
  -->
  <acme-button size="large">Hover the attr</acme-button>

</body>
</html>
