<!DOCTYPE html>
<html>
<head>
  <style>
    .container {
      background: var(--acme-color-background-button-primary-pressed);
      padding: var(--acme-spacing-lg);
    }
  </style>
</head>
<body>
  <!-- deprecated value: should warn -->
  <acme-button variant="tertiary" size="medium">Bad</acme-button>

  <!-- good values: should NOT warn -->
  <acme-button variant="secondary" size="small">Good</acme-button>

  <!-- slot completions: type slot=" inside here -->
  <acme-button variant="primary">
    <svg slot="">Icon</svg>
    Click me
  </acme-button>

  <!-- deprecated attribute: should warn -->
  <acme-button label="Don't do this" variant="primary"></acme-button>

  <!-- draft component: should info -->
  <acme-shortcut label="Settings"></acme-shortcut>
</body>
</html>
