name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Check publishable
        run: npm run check:publishable
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Publish (skip if version already published)
        run: |
          if npm view "@designlasagna/ds-language-server@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "Version ${GITHUB_REF_NAME#v} is already published on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
